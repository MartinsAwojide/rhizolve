services:
  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    ports:
      - "7860:7860"
    volumes:
      - ../backend:/app
    environment:
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis

  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/web/src:/app/src
    depends_on:
      - backend

volumes:
  redis-data:
