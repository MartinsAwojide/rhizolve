services:
  redis:
    image: redis:8-alpine
    command: redis-server --save 60 1
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=rhizolve
      - POSTGRES_PASSWORD=rhizolve
      - POSTGRES_DB=rhizolve
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile.dev
    ports:
      - "7860:7860"
    volumes:
      - ../backend:/app
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql+psycopg://rhizolve:rhizolve@postgres:5432/rhizolve
    depends_on:
      - redis
      - postgres

  frontend:
    build:
      context: ../frontend/web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ../frontend/web/src:/app/src
    depends_on:
      - backend

volumes:
  redis-data:
  postgres-data:
