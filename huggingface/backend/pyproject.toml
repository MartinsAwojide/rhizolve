# Public POC deployment deps — mirrors backend/pyproject.toml's runtime
# dependency list plus `gradio` (for gr.Server, see ADR-022). Kept
# manually in sync; update this file when backend/pyproject.toml's
# `dependencies` list changes.
[project]
name = "rhizolve-hf-poc"
version = "0.1.0"
description = "Rhizolve public POC — gr.Server deployment (see ADR-022)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.13.0",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "clerk-backend-api>=6.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.139.0",
    "gradio>=6.0.0",
    "langgraph>=1.2.8",
    "langgraph-checkpoint-redis>=0.5.0",
    "openai>=2.44.0",
    "psycopg[binary]>=3.3.4",
    "python-multipart>=0.0.32",
    "sendgrid>=6.12.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
]
