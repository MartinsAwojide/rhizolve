name: Security

on:
  push:
  pull_request:

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: pip-audit
        working-directory: backend
        run: uv run pip-audit

  frontend-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      - name: Install dependencies
        working-directory: frontend/web
        run: pnpm install --frozen-lockfile

      - name: pnpm audit
        working-directory: frontend/web
        run: pnpm audit

  image-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: backend
          - name: frontend
            context: frontend/web
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.name }} image
        run: docker build -f ${{ matrix.context }}/Dockerfile.dev -t rhizolve-${{ matrix.name }}-dev ${{ matrix.context }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: rhizolve-${{ matrix.name }}-dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
