name: CI Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci-backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rhizolve
          POSTGRES_PASSWORD: rhizolve
          POSTGRES_DB: rhizolve
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhizolve"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Check for equipment_context
        run: |
          if grep -r "equipment_context" backend/ \
            --exclude-dir=.venv --exclude-dir=.pytest_cache \
            --exclude=test_no_equipment_context.py; then
            echo "::error::equipment_context found in backend/ — rename to system_or_process_context"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        working-directory: backend
        run: uv sync --all-extras --dev

      - name: Ruff check
        working-directory: backend
        run: uv run ruff check .

      - name: Mypy
        working-directory: backend
        run: uv run mypy .

      - name: Alembic upgrade
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://rhizolve:rhizolve@localhost:5432/rhizolve
        run: uv run alembic upgrade head

      - name: Pytest
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379
          DATABASE_URL: postgresql+asyncpg://rhizolve:rhizolve@localhost:5432/rhizolve
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          CLERK_SECRET_KEY: dummy-ci-value-tests-monkeypatch-verify-clerk-token
        run: uv run pytest
