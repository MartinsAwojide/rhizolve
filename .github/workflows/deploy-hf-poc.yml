name: Deploy HF POC

on:
  push:
    branches: [main]
    paths:
      - "huggingface/**"
      - "backend/agent/**"
      - "backend/core/**"
      - "backend/models/**"
      - "backend/api/**"
      - "frontend/web/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Copy the real backend/frontend source into huggingface/ on disk
      # only (never committed — see .gitignore). Needed because
      # huggingface/hub-sync's `subdirectory` sync only uploads this
      # folder's contents to the Space; huggingface/backend/main.py
      # imports agent/core/models/api as siblings, and the Dockerfile's
      # Node stage builds frontend/web. See ADR-022.
      - name: Assemble deployable POC source
        run: ./scripts/hf-poc-assemble.sh

      - uses: astral-sh/setup-uv@v8.3.2

      # huggingface/hub-sync@v0.1.0 always runs `hf repo create --exist-ok`
      # before uploading, and HF's API validates SDK/hardware billing
      # eligibility on that call even with --exist-ok — 402s for a
      # non-PRO account regardless of the Space already existing. The
      # Space is created manually (see huggingface/README.md prerequisites),
      # so upload alone (no create call) is all this job needs.
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload "${{ vars.HF_SPACE_ID }}" huggingface \
            --repo-type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --delete="*" \
            --commit-message="Sync from GitHub"
