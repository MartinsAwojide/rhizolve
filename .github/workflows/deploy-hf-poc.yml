name: Deploy HF POC

on:
  push:
    branches: [main]
    paths:
      - "huggingface/**"
      - "backend/agent/**"
      - "backend/core/**"
      - "backend/models/**"
      - "backend/api/**"
      - "frontend/web/**"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Copy the real backend/frontend source into huggingface/ on disk
      # only (never committed — see .gitignore). Needed because
      # huggingface/hub-sync's `subdirectory` sync only uploads this
      # folder's contents to the Space; huggingface/backend/main.py
      # imports agent/core/models/api as siblings, and the Dockerfile's
      # Node stage builds frontend/web. See ADR-022.
      - name: Assemble deployable POC source
        run: ./scripts/hf-poc-assemble.sh

      - uses: astral-sh/setup-uv@v8.3.2

      # KNOWN BROKEN as of 2026-07-13 on a non-PRO HF account: both
      # huggingface/hub-sync@v0.1.0's explicit `hf repo create --exist-ok`
      # and `hf upload`'s own implicit create_repo(exist_ok=True) call
      # 402 ("Docker Spaces on free cpu-basic require a PRO subscription")
      # even though the Space already exists — HF's billing check fires
      # on the create-repo API call regardless of exist_ok. Confirmed via
      # two full workflow runs, not a CLI-flag fix. Two ways forward,
      # neither implemented yet:
      #   1. Get HF PRO on the account this Space lives under.
      #   2. Switch this step to a git-push-based sync (clone/init a repo
      #      pointed at the Space's own git remote, token-authed HTTPS,
      #      commit + force-push) — bypasses the create-repo API path
      #      entirely since it's a plain git push to an existing repo.
      - name: Upload to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uvx hf upload "${{ vars.HF_SPACE_ID }}" huggingface \
            --repo-type space \
            --exclude=".git*" \
            --exclude=".github*" \
            --delete="*" \
            --commit-message="Sync from GitHub"
