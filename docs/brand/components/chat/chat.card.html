<!-- @dsCard group="Components" viewport="700x520" name="Chat interrupt cards" subtitle="Gemba, hypothesis, validator, countermeasure, suggestion + voices" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); }
  #root { padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const NS = window.RhizolveDesignSystem_959827;
  const { ChatBubble, GembaCheckCard, HypothesisReviewCard, ValidatorReviewCard, CountermeasureReviewCard, SuggestionCard } = NS;
  function Demo() {
    return (
      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 20, alignItems: 'start' }}>
        <div>
          <div style={{ marginBottom: 12 }}>
            <ChatBubble author="user" name="You">Line 3 keeps stopping mid-shift.</ChatBubble>
            <ChatBubble author="agent">Two independent checks point to a worn conveyor seal. Let's verify on the floor.</ChatBubble>
          </div>
          <HypothesisReviewCard
            hypotheses={[{ id: 'h1', text: 'Worn conveyor seal on line 3' }, { id: 'h2', text: 'Incorrect torque specification at station 3' }, { id: 'h3', text: 'Contaminated lubricant batch' }]}
          />
          <div style={{ height: 16 }} />
          <ValidatorReviewCard
            decision="root_cause"
            confidence={0.82}
            rationale="Both Gemba checks confirm the seal wear; no deeper cause remains unexamined."
          />
          <div style={{ height: 16 }} />
          <SuggestionCard
            targetNode="1.2"
            suggestion="Consider a lubricant-contamination branch — three prior line-3 investigations traced overheating to a bad grease batch."
          />
        </div>
        <div>
          <GembaCheckCard
            hypothesis="Worn conveyor seal on line 3"
            instructions="Inspect the seal at station 3. Photograph any visible wear or debris before deciding."
            branch="3.1"
          />
          <div style={{ height: 16 }} />
          <CountermeasureReviewCard
            rootCause="Worn conveyor seal, line 3"
            countermeasure="Replace the seal and add a monthly wear inspection to the preventive-maintenance schedule."
          />
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
