<!-- @dsCard group="Components" viewport="700x320" name="Investigation vocabulary" subtitle="Node status, mode, connectivity, maturity" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); }
  #root { padding: 20px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { NodeStatusMarker, StatusDot, ModeIndicator, ConnectivityIndicator, MaturityMeter } = window.RhizolveDesignSystem_959827;
  const nodes = [
    ['active', 'active'], ['ruledOut', 'ruled out'], ['rootCause', 'root cause'],
    ['suspended', 'suspended'], ['conflict', 'conflict'],
  ];
  const Label = ({ children }) => (
    <div style={{ fontSize: 11, color: 'var(--text-muted)', fontWeight: 500, marginBottom: 10 }}>{children}</div>
  );
  function Demo() {
    return (
      <div>
        <Label>Node-status vocabulary — the coral system (why-tree · fault-tree only)</Label>
        <div style={{ display: 'flex', gap: 26, marginBottom: 24 }}>
          {nodes.map(([s, l]) => (
            <div key={s} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
              <NodeStatusMarker status={s} size={36} emphaticRuledOut={s === 'ruledOut'} />
              <span style={{ fontSize: 11, color: 'var(--text-secondary)' }}>{l}</span>
            </div>
          ))}
        </div>
        <div style={{ display: 'flex', gap: 40, flexWrap: 'wrap' }}>
          <div>
            <Label>Project status</Label>
            <div style={{ display: 'flex', gap: 16 }}>
              <StatusDot status="active" withLabel />
              <StatusDot status="closed" withLabel />
              <StatusDot status="draft" withLabel />
            </div>
          </div>
          <div>
            <Label>Chat mode</Label>
            <div style={{ display: 'flex', gap: 8 }}>
              <ModeIndicator mode="shallow" />
              <ModeIndicator mode="deep" />
            </div>
          </div>
          <div>
            <Label>Android connectivity</Label>
            <div style={{ display: 'flex', gap: 8 }}>
              <ConnectivityIndicator mode="cloud" />
              <ConnectivityIndicator mode="hybrid" />
              <ConnectivityIndicator mode="local" />
            </div>
          </div>
          <div>
            <Label>Maturity</Label>
            <MaturityMeter level={4} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
