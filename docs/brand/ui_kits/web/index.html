<!-- @dsCard group="Web app" viewport="1280x800" name="Web client" subtitle="Three-column investigation workspace — login → dashboard → chat + why-tree" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhizolve — web client</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--surface-0); }
  #root { height: 100vh; overflow: hidden; }
  .theme-toggle { position: fixed; right: 16px; bottom: 16px; z-index: 50; height: 34px; padding: 0 14px; border-radius: 9999px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text-secondary); font-family: var(--font-sans); font-size: 13px; font-weight: 500; cursor: pointer; box-shadow: var(--shadow-md); }
</style>
</head>
<body>
<div id="root"></div>
<button class="theme-toggle" onclick="(function(){var h=document.documentElement;h.setAttribute('data-theme',h.getAttribute('data-theme')==='dark'?'light':'dark');})()">◐ Theme</button>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>

<script type="text/babel" src="Logo.jsx"></script>
<script type="text/babel" src="WhyTree.jsx"></script>
<script type="text/babel" src="LoginScreen.jsx"></script>
<script type="text/babel" src="DashboardScreen.jsx"></script>
<script type="text/babel" src="InvestigationScreen.jsx"></script>
<script type="text/babel" src="ReportScreen.jsx"></script>

<script type="text/babel">
  const { LoginScreen, DashboardScreen, InvestigationScreen, ReportScreen } = window;
  function App() {
    const [screen, setScreen] = React.useState('login'); // login | dashboard | investigation | report
    if (screen === 'login') return <LoginScreen onSignIn={() => setScreen('dashboard')} />;
    if (screen === 'dashboard') return <DashboardScreen onOpenProject={() => setScreen('investigation')} onSignOut={() => setScreen('login')} />;
    if (screen === 'report') return <ReportScreen onBack={() => setScreen('investigation')} />;
    return <InvestigationScreen onBack={() => setScreen('dashboard')} onExportReport={() => setScreen('report')} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
