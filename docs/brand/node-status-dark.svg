<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" font-family="Inter, sans-serif">
  <title>Rhizolve node-status vocabulary — dark mode</title>
  <rect width="560" height="120" fill="#12161C"/>

  <!-- active / confirmed: solid coral -->
  <circle cx="56" cy="44" r="16" fill="#F0997B"/>
  <text x="56" y="86" font-size="11" text-anchor="middle" fill="#BDB8B0">active</text>

  <!-- ruled out: hollow, grey outline, X -->
  <circle cx="160" cy="44" r="16" fill="#222833" stroke="#B4B2A9" stroke-width="2.5"/>
  <path d="M152,36 L168,52 M168,36 L152,52" stroke="#F09595" stroke-width="2.5"/>
  <text x="160" y="86" font-size="11" text-anchor="middle" fill="#BDB8B0">ruled out</text>

  <!-- root cause: green-plus outline -->
  <circle cx="264" cy="44" r="16" fill="#222833" stroke="#5DCAA5" stroke-width="2.5"/>
  <path d="M264,35 L264,53 M255,44 L273,44" stroke="#5DCAA5" stroke-width="2.5"/>
  <text x="264" y="86" font-size="11" text-anchor="middle" fill="#BDB8B0">root cause</text>

  <!-- suspended: dashed blue outline -->
  <circle cx="368" cy="44" r="16" fill="#222833" stroke="#85B7EB" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="368" y="86" font-size="11" text-anchor="middle" fill="#BDB8B0">suspended</text>

  <!-- conflict: split-colour donut -->
  <path d="M472,28 a16,16 0 0 1 0,32 Z" fill="#EF9F27"/>
  <path d="M472,60 a16,16 0 0 1 0,-32 Z" fill="#F0997B"/>
  <circle cx="472" cy="44" r="7" fill="#222833"/>
  <text x="472" y="86" font-size="11" text-anchor="middle" fill="#BDB8B0">conflict</text>
</svg>
