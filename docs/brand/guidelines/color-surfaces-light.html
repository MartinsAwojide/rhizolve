<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces — light" subtitle="Warm off-white editorial base; steps up toward white" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: 12px; border: 1px solid var(--border); overflow: hidden; }
  .chip { height: 62px; }
  .meta { padding: 8px 12px; }
  .name { font-size: 13px; font-weight: 500; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#FAF7F2"></div><div class="meta"><div class="name">Canvas</div><div class="tok">--surface-0</div><div class="hex">#FAF7F2</div></div></div>
    <div class="sw"><div class="chip" style="background:#F3EEE6"></div><div class="meta"><div class="name">Subtle fill</div><div class="tok">--surface-1</div><div class="hex">#F3EEE6</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">Raised card</div><div class="tok">--surface-2</div><div class="hex">#FFFFFF</div></div></div>
  </div>
</body>
</html>
