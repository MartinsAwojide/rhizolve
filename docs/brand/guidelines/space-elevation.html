<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Soft, low-spread editorial shadows: sm · md · lg" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); padding: 26px; }
  .row { display: flex; gap: 26px; }
  .card { flex: 1; height: 72px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-family: var(--font-mono); font-size: 11px; }
</style>
</head>
<body>
  <div class="row">
    <div class="card" style="box-shadow:var(--shadow-sm)">--shadow-sm</div>
    <div class="card" style="box-shadow:var(--shadow-md)">--shadow-md</div>
    <div class="card" style="box-shadow:var(--shadow-lg)">--shadow-lg</div>
  </div>
</body>
</html>
