<!-- @dsCard group="Spacing" viewport="700x170" name="Radius & touch targets" subtitle="control 8 · card 12 · pill full · touch 48/56dp" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); padding: 22px; }
  .row { display: flex; gap: 20px; align-items: center; }
  .box { background: var(--surface-2); border: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: center; color: var(--text-muted); font-size: 11px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); margin-top: 8px; text-align: center; }
</style>
</head>
<body>
  <div class="row">
    <div><div class="box" style="width:88px;height:56px;border-radius:8px">control</div><div class="tok">8px</div></div>
    <div><div class="box" style="width:88px;height:56px;border-radius:12px">card</div><div class="tok">12px</div></div>
    <div><div class="box" style="width:88px;height:56px;border-radius:9999px">pill</div><div class="tok">full</div></div>
    <div style="margin-left:auto"><div class="box" style="width:56px;height:56px;border-radius:8px;border-color:var(--node-active);color:var(--node-active)">56</div><div class="tok">Gemba 56dp</div></div>
  </div>
</body>
</html>
