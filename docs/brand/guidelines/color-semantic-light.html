<!-- @dsCard group="Colors" viewport="700x150" name="Semantic roles — light" subtitle="Success teal · danger red · warning amber (kept vivid at AA, not AAA)" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); padding: 20px; }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; }
  .chip { height: 44px; border-radius: 8px; }
  .name { font-size: 13px; font-weight: 500; color: var(--text-primary); margin-top: 8px; }
  .tok { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0F6E56"></div><div class="name">Success</div><div class="tok">--success · #0F6E56</div></div>
    <div class="sw"><div class="chip" style="background:#A32D2D"></div><div class="name">Danger</div><div class="tok">--danger · #A32D2D</div></div>
    <div class="sw"><div class="chip" style="background:#854F0B"></div><div class="name">Warning</div><div class="tok">--warning · #854F0B</div></div>
  </div>
</body>
</html>
