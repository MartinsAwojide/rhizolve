<!-- @dsCard group="Colors" viewport="700x170" name="Node-status coral" subtitle="The one place coral lives — never UI chrome. Light + dark values." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-0); font-family: var(--font-sans); padding: 20px; }
  h4 { margin: 0 0 10px; font-size: 11px; font-weight: 500; color: var(--text-muted); }
  .row { display: flex; gap: 12px; margin-bottom: 16px; }
  .sw { text-align: center; }
  .chip { width: 46px; height: 46px; border-radius: 8px; margin-bottom: 6px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); }
</style>
</head>
<body>
  <h4>Light</h4>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#D85A30"></div><div class="tok">active #D85A30</div></div>
    <div class="sw"><div class="chip" style="background:#888780"></div><div class="tok">ruled #888780</div></div>
    <div class="sw"><div class="chip" style="background:#0F6E56"></div><div class="tok">root #0F6E56</div></div>
    <div class="sw"><div class="chip" style="background:#378ADD"></div><div class="tok">susp #378ADD</div></div>
    <div class="sw"><div class="chip" style="background:#BA7517"></div><div class="tok">conflict #BA7517</div></div>
  </div>
  <h4>Dark</h4>
  <div class="row" style="margin-bottom:0">
    <div class="sw"><div class="chip" style="background:#F0997B"></div><div class="tok">active #F0997B</div></div>
    <div class="sw"><div class="chip" style="background:#B4B2A9"></div><div class="tok">ruled #B4B2A9</div></div>
    <div class="sw"><div class="chip" style="background:#5DCAA5"></div><div class="tok">root #5DCAA5</div></div>
    <div class="sw"><div class="chip" style="background:#85B7EB"></div><div class="tok">susp #85B7EB</div></div>
    <div class="sw"><div class="chip" style="background:#EF9F27"></div><div class="tok">conflict #EF9F27</div></div>
  </div>
</body>
</html>
